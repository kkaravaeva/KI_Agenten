env_settings:
  num_envs: 2
  seed: 42

behaviors:

  # -- LSTM ------------------------------------------------------------------
  LSTM_Navigator:
    trainer_type: ppo

    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
      memory:
        sequence_length: 32
        memory_size: 256
        memory_type: lstm

    hyperparameters:
      learning_rate: 3.0e-4
      batch_size: 2048
      buffer_size: 102400
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 5
      learning_rate_schedule: linear

    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
      curiosity:
        strength: 0.05
        gamma: 0.99
        learning_rate: 3.0e-4
        network_settings:
          hidden_units: 128
          num_layers: 2

    max_steps: 30000000
    time_horizon: 512
    summary_freq: 10000
    keep_checkpoints: 5
    checkpoint_interval: 200000

  # -- Transformer -----------------------------------------------------------
