behaviors:
  LabyrinthNavigator:
    trainer_type: ppo

    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
      memory:
        sequence_length: 16
        memory_size: 256
        memory_type: lstm

    hyperparameters:
      learning_rate: 3.0e-4
      batch_size: 512
      buffer_size: 40960
      beta: 8.0e-3        # etwas mehr Entropy → mehr Exploration
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear

    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
      curiosity:
        gamma: 0.99
        strength: 0.02    # Neugier-Bonus für unbekannte Zustände
        network_settings:
          hidden_units: 256
          num_layers: 2

    max_steps: 30000000
    time_horizon: 512
    summary_freq: 10000
    keep_checkpoints: 5
    checkpoint_interval: 200000
